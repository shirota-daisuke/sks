<!-- SC-02 仮登録画面（中央配置の仮登録カード） -->
<div class="sks-register">
  <div class="panel panel-default sks-register-card">
    <div class="panel-body">

      <h2 class="sks-register-title">仮登録</h2>

      <!-- 入力フォーム -->
      <div ng-if="c.view === 'form'">
        <div class="alert alert-danger" ng-if="c.serverErrors.length" role="alert">
          <ul class="list-unstyled sks-error-list">
            <li ng-repeat="err in c.serverErrors track by $index">{{err}}</li>
          </ul>
        </div>

        <form name="registerForm" ng-submit="c.submit()" novalidate>
          <div class="form-group"
               ng-class="{'has-error': registerForm.loginId.$touched && registerForm.loginId.$invalid}">
            <label for="sks-login-id">ログインID <span class="text-danger">*</span></label>
            <input type="text" id="sks-login-id" name="loginId" class="form-control"
                   placeholder="半角英数字で入力"
                   ng-model="c.form.login_id"
                   ng-pattern="/^[0-9A-Za-z]{4,20}$/"
                   maxlength="20" required />
            <span class="help-block" ng-if="registerForm.loginId.$touched && registerForm.loginId.$error.required">
              ログインIDを入力してください。
            </span>
            <span class="help-block" ng-if="registerForm.loginId.$touched && registerForm.loginId.$error.pattern">
              半角英数字4～20桁で入力してください。
            </span>
          </div>

          <div class="form-group"
               ng-class="{'has-error': registerForm.email.$touched && registerForm.email.$invalid}">
            <label for="sks-email">メールアドレス <span class="text-danger">*</span></label>
            <input type="email" id="sks-email" name="email" class="form-control"
                   placeholder="example@company.co.jp"
                   ng-model="c.form.email"
                   maxlength="256" required />
            <span class="help-block" ng-if="registerForm.email.$touched && registerForm.email.$error.required">
              メールアドレスを入力してください。
            </span>
            <span class="help-block" ng-if="registerForm.email.$touched && registerForm.email.$error.email">
              メールアドレスの形式が正しくありません。
            </span>
          </div>

          <button type="submit" class="btn btn-primary btn-block"
                  ng-disabled="c.submitting || registerForm.$invalid">
            <span ng-if="c.submitting"><i class="fa fa-spinner fa-spin"></i> 送信中…</span>
            <span ng-if="!c.submitting">仮登録する</span>
          </button>
        </form>

        <p class="sks-register-note">{{c.data.noticeMessage}}</p>
      </div>

      <!-- 仮登録完了メッセージ -->
      <div ng-if="c.view === 'done'" class="text-center sks-register-done">
        <i class="fa fa-check-circle fa-3x text-success" aria-hidden="true"></i>
        <p class="sks-done-lead">仮登録を受け付けました。</p>
        <p class="text-muted">
          <strong>{{c.registeredEmail}}</strong> 宛に本登録用のご案内をお送りしました。<br />
          メール内のリンクから本登録にお進みください。
        </p>
        <p class="text-muted sks-done-note">
          メールが届かない場合は、迷惑メールフォルダをご確認ください。
        </p>
      </div>

    </div>
  </div>
</div>
