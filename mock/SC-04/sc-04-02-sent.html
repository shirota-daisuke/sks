<!DOCTYPE html>
<!--
  ============================================================================
  SC-04 パスワードリセット画面 ②STEP1 送信完了
  ============================================================================
  画面設計書  SC-04 ③アクション No.1「再設定用リンクを送信」（処理No.11 前半）
  実装         src/fluent/sp-widget/password-reset-form/server_script.js  sendResetLink()
              src/fluent/sp-widget/password-reset-form/client_script.js   c.sent = true
  表示条件     c.sent === true（sendResult.success）
              → STEP1 のフォームは ng-if="!c.sent" で非表示になる
  ============================================================================
  この時点の処理内容（該当ユーザが存在する場合のみ）
    x_dent2_dentsusoke_user（更新）
      ・u_password_reset_token        = GUID×2（64桁）
      ・u_password_reset_expires_on   = 24時間後（options.token_valid_hours 既定24）
    → gs.eventQueue('x_dent2_dentsusoke.password.reset', ...) で再設定メールを起動

  対象外となるユーザ（トークンを発行せずメールも生成しない）
    ・u_registration_status が 登録中（仮登録のみ・パスワード未設定）／登録不可
    ・u_auth_method = SSO（パスワードを持たない）
    ・active = false
    ・そもそも該当メールアドレスが存在しない
  ============================================================================
  ★ セキュリティ方針（要レビュー）
    上記いずれの場合も画面には同一の完了メッセージを返す（アカウント存在の非開示）。
    「入力されたメールアドレスが登録されている場合のみメールが届きます」の補足で利用者に伝える。
  ============================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SC-04 パスワードリセット ②STEP1 送信完了</title>
<link rel="stylesheet" href="../assets/sks-mock.css" />
</head>
<body>

<header class="mock-header">
  <div class="container mock-header-inner">
    <span class="mock-portal-title">成長加速支援補助金 申請ポータル</span>
    <a class="mock-header-link" href="../SC-01/sc-01-01-login.html">ログイン</a>
  </div>
</header>

<main class="mock-main">
  <div class="container">

    <p class="mock-note">
      <b>②STEP1 送信完了</b>：<code>c.sent === true</code>。
      完了メッセージを表示し、STEP1 の入力フォームは非表示にする（二重送信防止）。STEP2 は引き続き案内文のみ。
    </p>

    <div class="sks-reset">
      <div class="panel panel-default sks-reset-card">
        <div class="panel-body">

          <div class="sks-step">
            <h3 class="sks-step-title">STEP1：再設定メールの送信</h3>

            <!-- ng-if="c.sent" -->
            <div class="alert alert-success" role="alert">
              再設定用リンクを送信しました。ご登録のメールアドレスをご確認ください。<br />
              <small>入力されたメールアドレスが登録されている場合のみメールが届きます。</small>
            </div>

            <!-- ng-if="!c.sent" の <form> は描画されない -->
          </div>

          <hr class="sks-step-divider" />

          <div class="sks-step">
            <h3 class="sks-step-title">STEP2：新しいパスワードの設定</h3>

            <p class="text-muted">
              メール内の再設定用リンクからアクセスすると、この欄で新しいパスワードを設定できます。
            </p>
          </div>

        </div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
