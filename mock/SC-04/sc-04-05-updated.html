<!DOCTYPE html>
<!--
  ============================================================================
  SC-04 パスワードリセット画面 ⑥パスワード更新完了
  ============================================================================
  画面設計書  SC-04 ③アクション No.2「パスワードを更新」（処理No.11 後半）
              SC-04 ④画面遷移（更新後は SC-01 ログイン画面へ遷移）
  実装         src/fluent/sp-widget/password-reset-form/server_script.js  updatePassword()
              src/fluent/sp-widget/password-reset-form/client_script.js   $timeout → $window.location.href
  表示条件     data.tokenState === 'used'（updateResult.success === true）
  ============================================================================
  この時点の処理内容
    x_dent2_dentsusoke_user（更新）
      ・user_password                 = 入力パスワード（プラットフォームがハッシュ化）
      ・password_needs_reset          = false
      ・u_password_reset_token        = 空（使い切り）
      ・u_password_reset_expires_on   = 空
  遷移
    完了メッセージを 1.5 秒表示した後、options.login_page（x_dent2_dentsusoke_login）へ遷移する。
  ============================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SC-04 パスワードリセット ⑥更新完了</title>
<link rel="stylesheet" href="../assets/sks-mock.css" />
</head>
<body>

<header class="mock-header">
  <div class="container mock-header-inner">
    <span class="mock-portal-title">成長加速支援補助金 申請ポータル</span>
    <span class="mock-user">未ログイン</span>
  </div>
</header>

<main class="mock-main">
  <div class="container">

    <p class="mock-note">
      <b>⑥更新完了</b>：<code>data.tokenState === 'used'</code>。
      完了メッセージを 1.5 秒表示した後、<code>?id=x_dent2_dentsusoke_login</code>（SC-01）へ自動遷移する。
      トークンは使い切りのため、同じリンクを再度開くと ④トークン不正 になる。
    </p>

    <div class="sks-reset">
      <div class="panel panel-default sks-reset-card">
        <div class="panel-body">

          <div class="sks-step">
            <h3 class="sks-step-title">STEP1：再設定メールの送信</h3>
            <form name="sendForm" novalidate>
              <div class="form-group">
                <label for="sks-reset-email">登録済みメールアドレス <span class="text-danger">*</span></label>
                <input type="email" id="sks-reset-email" name="resetEmail" class="form-control"
                       placeholder="example@company.co.jp" maxlength="256" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block" disabled>再設定用リンクを送信</button>
            </form>
          </div>

          <hr class="sks-step-divider" />

          <div class="sks-step">
            <h3 class="sks-step-title">STEP2：新しいパスワードの設定</h3>

            <!-- ng-if="c.data.tokenState === 'used'" -->
            <div class="alert alert-success" role="alert">
              パスワードを更新しました。ログイン画面へ移動します…
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
